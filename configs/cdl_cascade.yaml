model:
  layers: 20
  weight_block_size: 16
  act_block_size: 16
  topk_act: 5
  kappa: 2.0
  alpha: 1.0
  weight_quant: cdl  # cdl | nvfp4
  activation_quant: nvfp4  # cdl | nvfp4
  backend: fp4  # native (dequant + bf16 matmul) | fp4 (mm_fp4 kernel) | fused (triton kernel)

train:
  epochs: 200
  freeze_kappa: true
  kappa_end: null  # null = static kappa; else exponential ramp kappa -> kappa_end
  freeze_alpha: false
  batch_size: 64
  learning_rate: 0.1
  weight_decay: 0.0005
  momentum: 0.9
  milestones:
    - 60
    - 120
    - 160
  sched_gamma: 0.1
  calib_batches: 1

logging:
  eval_every_epochs: 1
  log_every_steps: 50
  recal_bn_batches: 100
