model:
  layers: 20
  relaxed: false
  bits: 6
  bits_edge: 8
  topk_act: 5
  kappa: 1.0

train:
  lam: 0.0
  gam: 0.0
  epochs: 200
  freeze_kappa: true
  batch_size: 64
  learning_rate: 0.1
  weight_decay: 0.0005
  momentum: 0.9
  milestones:
    - 60
    - 120
    - 160
  sched_gamma: 0.1
  calib_batches: 1

logging:
  eval_every_epochs: 1
  log_every_steps: 50
